<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Edition</title>
<style>
  :root { --paper: #F6F1E7; --ink: #1F1E1C; --secondary: #45413B; --accent: #8A1C1C; }
  @media (prefers-color-scheme: dark) { :root { --paper: #161513; --ink: #EAE5D9; --secondary: #C4BEB2; --accent: #E89A7E; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1rem; text-align: center; }
  .masthead { font-family: Didot, "Bodoni 72", Georgia, serif; font-weight: 700; font-size: clamp(2rem, 7vw, 3rem); margin: 0; }
  .rules { border-top: 4px solid var(--ink); border-bottom: 1px solid var(--ink); height: 7px; margin: .75rem 0 1.5rem; }
  p { color: var(--secondary); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="masthead" style="color: var(--ink)">The Daily Edition</p>
  <div class="rules" aria-hidden="true"></div>
  <p>A personal newspaper for iPhone and iPad, made from the sources you choose.</p>
  <p><a href="privacy.html">Privacy Policy</a></p>
</main>
</body>
</html>
